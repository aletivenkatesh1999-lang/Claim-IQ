services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://claimiq:claimiq@db:5432/claimiq
      CLAIMIQ_SECRET_KEY: replace-this-before-deployment
      ACCESS_TOKEN_MINUTES: 60
      UPLOAD_DIRECTORY: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - claimiq_uploads:/app/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claimiq
      POSTGRES_USER: claimiq
      POSTGRES_PASSWORD: claimiq
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U claimiq
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - claimiq_postgres:/var/lib/postgresql/data

volumes:
  claimiq_postgres:
  claimiq_uploads: